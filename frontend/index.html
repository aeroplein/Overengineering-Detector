<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overengineer Detector</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="shell">
        <section class="topbar">
            <div>
                <p class="eyebrow">Overengineer Detector</p>
                <h1>Project stack analysis</h1>
            </div>
            <div class="session">
                <span id="sessionEmail">Signed out</span>
                <button id="logoutButton" class="ghost hidden" type="button">Log out</button>
            </div>
        </section>

        <section id="authView" class="authWrap">
            <div class="panel authPanel">
                <div class="authTabs" role="tablist" aria-label="Authentication">
                    <button id="showLoginButton" class="tabButton active" type="button">Login</button>
                    <button id="showRegisterButton" class="tabButton" type="button">Register</button>
                </div>

                <form id="loginForm">
                    <h2>Login</h2>
                    <label>
                        Email
                        <input name="email" type="email" autocomplete="email" required>
                    </label>
                    <label>
                        Password
                        <input name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <button type="submit">Login</button>
                </form>

                <form id="registerForm" class="hidden">
                    <h2>Register</h2>
                    <label>
                        Email
                        <input name="email" type="email" autocomplete="email" required>
                    </label>
                    <label>
                        Password
                        <input name="password" type="password" autocomplete="new-password" minlength="6" required>
                    </label>
                    <button type="submit">Create account</button>
                </form>
            </div>
        </section>

        <section id="appView" class="workspace hidden">
            <aside class="panel sidebar">
                <div class="panelHeader">
                    <h2>Projects</h2>
                    <button id="refreshProjectsButton" class="ghost" type="button">Refresh</button>
                </div>
                <div id="projectList" class="projectList"></div>
            </aside>

            <section class="stack">
                <form id="projectForm" class="panel formGrid">
                    <div class="formTitle">
                        <h2 id="projectFormTitle">Create project</h2>
                        <button id="cancelEditButton" class="ghost hidden" type="button">Cancel edit</button>
                    </div>
                    <label>
                        Name
                        <input name="name" type="text" placeholder="Portfolio API" required>
                    </label>
                    <label>
                        Daily users
                        <input name="daily_users" type="number" min="0" value="50" required>
                    </label>
                    <label>
                        Scale
                        <select name="scale" required>
                            <option>Personal</option>
                            <option>Startup</option>
                            <option>Enterprise</option>
                        </select>
                    </label>
                    <label>
                        Visibility
                        <select name="visibility">
                            <option value="private">Private</option>
                            <option value="public">Public</option>
                        </select>
                    </label>
                    <button id="projectSubmitButton" type="submit">Create project</button>
                </form>

                <section class="panel">
                    <div class="panelHeader">
                        <h2>Technologies</h2>
                        <button id="saveTechnologiesButton" type="button">Save selection</button>
                    </div>
                    <div id="technologyList" class="technologyList"></div>
                </section>

                <section class="panel">
                    <div class="panelHeader">
                        <h2>Analysis</h2>
                        <button id="analyzeButton" type="button">Analyze</button>
                    </div>
                    <section id="scoreDashboard" class="scoreDashboard hidden" aria-label="Analysis score dashboard">
                        <div class="metricGrid">
                            <div class="metricTile">
                                <span>Overall score</span>
                                <strong id="overallScore">0</strong>
                            </div>
                            <div class="metricTile">
                                <span>Necessary complexity</span>
                                <strong id="necessaryComplexity">0</strong>
                            </div>
                            <div class="metricTile">
                                <span>Overengineering</span>
                                <strong id="overengineeringPercent">0%</strong>
                            </div>
                            <div class="metricTile">
                                <span>Risk level</span>
                                <strong id="riskLevel">Low</strong>
                            </div>
                        </div>
                        <div class="chartGrid">
                            <div class="chartFrame">
                                <canvas id="scoreBreakdownChart" aria-label="Score breakdown chart"></canvas>
                            </div>
                            <div class="chartFrame">
                                <canvas id="overengineeringChart" aria-label="Overengineering percentage chart"></canvas>
                            </div>
                        </div>
                    </section>
                    <div id="analysisResult" class="analysisResult muted">Select a project and run analysis.</div>
                    <div class="historyBlock">
                        <h3>History</h3>
                        <div id="analysisHistory" class="analysisHistory muted">No analysis loaded.</div>
                    </div>
                </section>
            </section>
        </section>

        <p id="message" class="message" role="status"></p>
    </main>

    <div id="deleteDialog" class="dialogOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="deleteDialogTitle">
        <section class="dialogPanel">
            <h2 id="deleteDialogTitle">Delete project?</h2>
            <p id="deleteDialogText" class="muted"></p>
            <div class="dialogActions">
                <button id="cancelDeleteButton" class="ghost" type="button">Cancel</button>
                <button id="confirmDeleteButton" class="dangerButton" type="button">Delete project</button>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="./app.js" type="module"></script>
</body>
</html>
